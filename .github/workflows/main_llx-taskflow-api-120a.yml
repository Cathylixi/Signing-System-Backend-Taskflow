name: Test and deploy TaskFlow to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taskflow-production
  cancel-in-progress: false

env:
  AZURE_FUNCTIONAPP_NAME: llx-taskflow-api-120a
  PYTHON_VERSION: '3.12'
  AZURE_CLIENT_ID: 138202ee-11f7-49c0-977e-a7fc65160305
  AZURE_TENANT_ID: 92968397-05b6-4bc5-bb60-480c93060606
  AZURE_SUBSCRIPTION_ID: 120a2138-5e26-4a31-9f2f-5e5d702c1481

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run business-rule tests
        run: python -m pytest -q

      - name: Prepare deployment package
        run: |
          mkdir deploy-package
          cp function_app.py host.json requirements.txt deploy-package/
          cp -r shared web deploy-package/
          find deploy-package -type d -name __pycache__ -prune -exec rm -r {} +

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions Flex Consumption
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: deploy-package
          remote-build: true
